version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-framework:
        patterns: ["next", "eslint-config-next"]
    ignore:
      # eslint-plugin-react used by eslint-config-next still calls APIs removed
      # in ESLint 10. Revisit when the Next lint stack supports that major.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # The native TS 7 compiler omits compiler APIs used by tests and falls
      # outside the current Next lint stack's supported TypeScript range.
      - dependency-name: typescript
        versions: [">=7"]
      # Workflow 5 needs a durable-runtime migration, not a lockfile-only bump.
      - dependency-name: workflow
        versions: [">=5"]
      # Match the production Node 24 runtime; do not advertise newer APIs.
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
