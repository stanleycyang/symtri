version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react used by eslint-config-next still calls APIs removed
      # in ESLint 10. Revisit when the Next lint stack supports that major.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
